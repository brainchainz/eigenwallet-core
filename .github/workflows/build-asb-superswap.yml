name: Build SuperSwap asb image

# Builds the patched asb (1% maker developer tip to the Monero SuperSwap wallet)
# and pushes it to ghcr.io/brainchainz/asb. The swap-asb/Dockerfile is
# self-contained (compiles Monero C++ + the Rust workspace), so no extra setup
# is needed beyond checking out the monero-sys submodule.
#
# amd64 and arm64 build on separate native runners (arm64 no longer runs under
# QEMU emulation, which cannot finish a cold build inside the 6-hour job limit).
# Each platform pushes its own cache ref and digest; the merge job combines the
# two images into a single multi-arch manifest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "1pct"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            cache_ref: buildcache-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_ref: buildcache-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push asb image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./swap-asb/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/brainchainz/asb,push-by-digest=true,name-canonical=true,push=true
          # Registry layer cache so future rebuilds skip the Monero/Rust compile
          cache-from: type=registry,ref=ghcr.io/brainchainz/asb:${{ matrix.cache_ref }}
          cache-to: type=registry,ref=ghcr.io/brainchainz/asb:${{ matrix.cache_ref }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache_ref }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/brainchainz/asb:${{ github.event.inputs.tag }} \
            $(printf 'ghcr.io/brainchainz/asb@sha256:%s ' *)
